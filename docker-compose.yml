services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ielts_speaking}
      POSTGRES_USER: ${POSTGRES_USER:-ielts}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ielts}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ielts} -d ${POSTGRES_DB:-ielts_speaking}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  agent-harness:
    build:
      context: .
      dockerfile: services/agent-harness/Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-local}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      MOCK_MODEL_ENABLED: ${MOCK_MODEL_ENABLED:-true}
      MIMO_API_KEY: ${MIMO_API_KEY:-change-me}
      MIMO_BASE_URL: ${MIMO_BASE_URL:-https://api.mimo.example/v1}
      MIMO_DEFAULT_MODEL: ${MIMO_DEFAULT_MODEL:-mimo-v2.5-pro}
      MIMO_API_FORMAT: ${MIMO_API_FORMAT:-openai}
      MIMO_TIMEOUT_SECONDS: ${MIMO_TIMEOUT_SECONDS:-30}
      MIMO_MAX_RETRIES: ${MIMO_MAX_RETRIES:-2}
      MIMO_MODEL_ROUTES_JSON: ${MIMO_MODEL_ROUTES_JSON:-{}}
      MIMO_INPUT_COST_USD_PER_1K_TOKENS: ${MIMO_INPUT_COST_USD_PER_1K_TOKENS:-0}
      MIMO_OUTPUT_COST_USD_PER_1K_TOKENS: ${MIMO_OUTPUT_COST_USD_PER_1K_TOKENS:-0}
      MIMO_AVAILABLE_MODELS_JSON: ${MIMO_AVAILABLE_MODELS_JSON:-["mimo-v2.5-pro","mimo-v2.5","mimo-v2.5-asr","mimo-v2.5-tts-voiceclone","mimo-v2.5-tts-voicedesign","mimo-v2.5-tts","mimo-v2-pro","mimo-v2-omni","mimo-v2-tts"]}
      KNOWLEDGE_STORE_BACKEND: ${KNOWLEDGE_STORE_BACKEND:-memory}
      KNOWLEDGE_DATABASE_URL: ${KNOWLEDGE_DATABASE_URL:-postgres://ielts:ielts@postgres:5432/ielts_speaking?sslmode=disable}
      KNOWLEDGE_EMBEDDING_MODEL: ${KNOWLEDGE_EMBEDDING_MODEL:-hash-embedding-v1}
      KNOWLEDGE_EMBEDDING_DIMENSION: ${KNOWLEDGE_EMBEDDING_DIMENSION:-1536}
      KNOWLEDGE_CHUNK_MAX_CHARS: ${KNOWLEDGE_CHUNK_MAX_CHARS:-1200}
      KNOWLEDGE_CHUNK_OVERLAP_CHARS: ${KNOWLEDGE_CHUNK_OVERLAP_CHARS:-120}
      DOCUMENT_INGESTION_ENABLED: ${DOCUMENT_INGESTION_ENABLED:-true}
      DOCUMENT_INGESTION_POLL_INTERVAL_SECONDS: ${DOCUMENT_INGESTION_POLL_INTERVAL_SECONDS:-2}
      DOCUMENT_INGESTION_WORKER_ID: ${DOCUMENT_INGESTION_WORKER_ID:-}
      DOCUMENT_INGESTION_MAX_INLINE_ARTIFACT_CHARS: ${DOCUMENT_INGESTION_MAX_INLINE_ARTIFACT_CHARS:-16000}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_REGION: ${S3_REGION:-local}
      MINIO_BUCKET: ${MINIO_BUCKET:-ielts-speaking-local}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_USE_SSL: ${S3_USE_SSL:-false}
      LANGFUSE_ENABLED: ${LANGFUSE_ENABLED:-false}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_HOST: ${LANGFUSE_HOST:-http://langfuse:3000}
      LANGFUSE_TIMEOUT_SECONDS: ${LANGFUSE_TIMEOUT_SECONDS:-3}
      TRACE_USER_HASH_SALT: ${TRACE_USER_HASH_SALT:-local-trace-salt-change-me}
      TRACE_STORE_LIMIT: ${TRACE_STORE_LIMIT:-500}
      TRACE_PERSISTENCE_ENABLED: ${TRACE_PERSISTENCE_ENABLED:-true}
      TRACE_DATABASE_URL: ${TRACE_DATABASE_URL:-postgres://ielts:ielts@postgres:5432/ielts_speaking?sslmode=disable}
      TRACE_REASONING_RETENTION: ${TRACE_REASONING_RETENTION:-full}
      AGENT_STREAM_BUFFER_LIMIT: ${AGENT_STREAM_BUFFER_LIMIT:-1000}
      AGENT_STREAM_HEARTBEAT_SECONDS: ${AGENT_STREAM_HEARTBEAT_SECONDS:-15}
      AGENT_STREAM_MAX_CLIENTS_PER_RUN: ${AGENT_STREAM_MAX_CLIENTS_PER_RUN:-8}
      OBSERVABILITY_ERROR_RATE_ALERT_THRESHOLD: ${OBSERVABILITY_ERROR_RATE_ALERT_THRESHOLD:-0.1}
      OBSERVABILITY_LATENCY_P95_ALERT_MS: ${OBSERVABILITY_LATENCY_P95_ALERT_MS:-5000}
      SPEECH_ASSESSMENT_URL: ${SPEECH_ASSESSMENT_URL:-http://speech-assessment:8010}
    ports:
      - "${AGENT_HTTP_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 5

  agent-orchestrator:
    build:
      context: .
      dockerfile: services/agent-orchestrator/Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-local}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      MOCK_MODEL_ENABLED: ${MOCK_MODEL_ENABLED:-true}
      MIMO_API_KEY: ${MIMO_API_KEY:-change-me}
      MIMO_BASE_URL: ${MIMO_BASE_URL:-https://api.mimo.example/v1}
      MIMO_DEFAULT_MODEL: ${MIMO_DEFAULT_MODEL:-mimo-v2.5-pro}
      MIMO_API_FORMAT: ${MIMO_API_FORMAT:-openai}
      MIMO_TIMEOUT_SECONDS: ${MIMO_TIMEOUT_SECONDS:-30}
      MIMO_MAX_RETRIES: ${MIMO_MAX_RETRIES:-2}
      MIMO_MODEL_ROUTES_JSON: ${MIMO_MODEL_ROUTES_JSON:-{}}
      AGENT_ORCHESTRATOR_PORT: ${AGENT_ORCHESTRATOR_PORT:-8100}
      AGENT_HARNESS_FALLBACK_URL: ${AGENT_HARNESS_URL:-http://agent-harness:8000}
      TRACE_USER_HASH_SALT: ${TRACE_USER_HASH_SALT:-local-trace-salt-change-me}
      TRACE_STORE_LIMIT: ${TRACE_STORE_LIMIT:-500}
      TRACE_PERSISTENCE_ENABLED: ${TRACE_PERSISTENCE_ENABLED:-true}
      TRACE_DATABASE_URL: ${TRACE_DATABASE_URL:-postgres://ielts:ielts@postgres:5432/ielts_speaking?sslmode=disable}
      TRACE_REASONING_RETENTION: ${TRACE_REASONING_RETENTION:-full}
      AGENT_STREAM_BUFFER_LIMIT: ${AGENT_STREAM_BUFFER_LIMIT:-1000}
      AGENT_STREAM_HEARTBEAT_SECONDS: ${AGENT_STREAM_HEARTBEAT_SECONDS:-15}
      AGENT_STREAM_MAX_CLIENTS_PER_RUN: ${AGENT_STREAM_MAX_CLIENTS_PER_RUN:-8}
      ORCHESTRATOR_TOOL_LOOP_MAX_ITERATIONS: ${ORCHESTRATOR_TOOL_LOOP_MAX_ITERATIONS:-5}
      ORCHESTRATOR_AGENT_TIMEOUT_SECONDS: ${ORCHESTRATOR_AGENT_TIMEOUT_SECONDS:-30}
      KNOWLEDGE_STORE_BACKEND: ${KNOWLEDGE_STORE_BACKEND:-memory}
      KNOWLEDGE_DATABASE_URL: ${KNOWLEDGE_DATABASE_URL:-postgres://ielts:ielts@postgres:5432/ielts_speaking?sslmode=disable}
    ports:
      - "${AGENT_ORCHESTRATOR_PORT:-8100}:8100"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/healthz', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 5

  speech-assessment:
    build:
      context: .
      dockerfile: services/speech-assessment/Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-local}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SPEECH_ASSESSMENT_MODE: ${SPEECH_ASSESSMENT_MODE:-deterministic}
      SPEECH_ASR_TIMESTAMP_PROVIDER: ${SPEECH_ASR_TIMESTAMP_PROVIDER:-deterministic}
      FASTER_WHISPER_MODEL_SIZE: ${FASTER_WHISPER_MODEL_SIZE:-tiny}
      FASTER_WHISPER_DEVICE: ${FASTER_WHISPER_DEVICE:-cpu}
      FASTER_WHISPER_COMPUTE_TYPE: ${FASTER_WHISPER_COMPUTE_TYPE:-int8}
    ports:
      - "${SPEECH_ASSESSMENT_PORT:-8010}:8010"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/healthz', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 5

  api-go:
    build:
      context: .
      dockerfile: services/api-go/Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-local}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      API_HTTP_PORT: ${API_HTTP_PORT:-8080}
      DATABASE_URL: ${DATABASE_URL:-postgres://ielts:ielts@postgres:5432/ielts_speaking?sslmode=disable}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      JWT_SECRET: ${JWT_SECRET:-local-dev-change-me-minimum-32-chars}
      AUTH_CAPTCHA_TTL_SECONDS: ${AUTH_CAPTCHA_TTL_SECONDS:-180}
      AUTH_EMAIL_CODE_TTL_SECONDS: ${AUTH_EMAIL_CODE_TTL_SECONDS:-600}
      AUTH_EMAIL_CODE_COOLDOWN_SECONDS: ${AUTH_EMAIL_CODE_COOLDOWN_SECONDS:-60}
      AUTH_EMAIL_CODE_MAX_ATTEMPTS: ${AUTH_EMAIL_CODE_MAX_ATTEMPTS:-5}
      AUTH_EMAIL_CODE_DEBUG: ${AUTH_EMAIL_CODE_DEBUG:-true}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-no-reply@localhost}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-false}
      TRACE_USER_HASH_SALT: ${TRACE_USER_HASH_SALT:-local-trace-salt-change-me}
      AGENT_HARNESS_URL: ${AGENT_HARNESS_URL:-http://agent-harness:8000}
      SPEECH_ASSESSMENT_URL: ${SPEECH_ASSESSMENT_URL:-http://speech-assessment:8010}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      S3_REGION: ${S3_REGION:-local}
      MINIO_BUCKET: ${MINIO_BUCKET:-ielts-speaking-local}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_USE_SSL: ${S3_USE_SSL:-false}
      AUDIO_MAX_UPLOAD_BYTES: ${AUDIO_MAX_UPLOAD_BYTES:-26214400}
      AUDIO_MAX_DURATION_MS: ${AUDIO_MAX_DURATION_MS:-600000}
      KNOWLEDGE_MAX_UPLOAD_BYTES: ${KNOWLEDGE_MAX_UPLOAD_BYTES:-20971520}
    ports:
      - "${API_HOST_PORT:-18080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      agent-harness:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/api", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://api-go:8080}
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:18080}
      NEXT_PUBLIC_AGENT_EVENT_SOURCE: ${NEXT_PUBLIC_AGENT_EVENT_SOURCE:-websocket}
      AGENT_HARNESS_URL: ${AGENT_HARNESS_URL:-http://agent-harness:8000}
      AGENT_ORCHESTRATOR_URL: ${AGENT_ORCHESTRATOR_URL:-http://agent-orchestrator:8100}
      SPEECH_ASSESSMENT_URL: ${SPEECH_ASSESSMENT_URL:-http://speech-assessment:8010}
      PORT: 3000
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api-go:
        condition: service_healthy

volumes:
  postgres_data:
  minio_data:
